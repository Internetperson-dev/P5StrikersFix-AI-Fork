name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure
        run: xmake f -p windows -a x64 -m release -y

      - name: Build
        run: xmake build -v

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Version = (Select-String -Path 'src/dllmain.cpp' -Pattern 'sFixVer\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          Write-Host "Packaging version $Version"
          
          # Clean up tmp directory
          Remove-Item -Recurse -Force tmp -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path 'tmp' -Force | Out-Null
          
          # Copy .asi and .ini files directly to the root of tmp
          Copy-Item 'build/windows/x64/release/*.asi' -Destination 'tmp/'
          Copy-Item '*.ini' -Destination 'tmp/' -ErrorAction SilentlyContinue
          
          # Download and extract Ultimate-ASI-Loader
          Invoke-WebRequest -Uri 'https://github.com/ThirteenAG/Ultimate-ASI-Loader/releases/download/v9.7.0/Ultimate-ASI-Loader_x64.zip' -OutFile 'asi-loader.zip'
          Expand-Archive -Force 'asi-loader.zip' -DestinationPath 'asi-loader-extracted'
          
          # Find and move dinput8.dll to the root of tmp
          $DInput8 = Get-ChildItem 'asi-loader-extracted' -Recurse -Filter 'dinput8.dll' | Select-Object -First 1
          if ($DInput8) {
            Move-Item $DInput8.FullName -Destination 'tmp/dinput8.dll'
          } else {
            throw "dinput8.dll not found in the downloaded archive."
          }
          
          # Compress the contents of tmp directly into the zip archive
          Compress-Archive -Path 'tmp/*' -DestinationPath "P5StrikersFix_$Version.zip" -Force
          
          # Cleanup
          Remove-Item -Recurse -Force tmp, asi-loader-extracted, asi-loader.zip
          Get-Item "P5StrikersFix_$Version.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: P5StrikersFix
          path: P5StrikersFix_*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: P5StrikersFix
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
