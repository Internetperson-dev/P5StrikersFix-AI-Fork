;;;;;;;;;; General ;;;;;;;;;;

[Custom Resolution]
; Forces a custom resolution.
; You can leave these at 0 if you want your desktop resolution used instead.
Enabled = true
Width = 0
Height = 0

[Render Target Scaling]
; Scales the resolution of UI render targets. This mainly affects menus/3D previews etc.
; Set UseRenderScale to true if you would like the in-game "Render Scale" setting to be used in the scaling process too. 
; Set Width and Height to render the HUD/UI at an explicit resolution (e.g. 3840x2160 for 4K).
; Set them to 0 to use the game resolution instead. Useful for rendering the HUD sharper than the game (e.g. 1080p game + 4K HUD).
; Note: these values are still multiplied by the render scale when UseRenderScale is enabled, so set UseRenderScale to false for an exact resolution.
Enabled = true
UseRenderScale = true
Width = 0
Height = 0

;;;;;;;;;; Ultrawide/Narrower Fixes ;;;;;;;;;;

[Fix UI]
; Fixes stretched UI.
Enabled = true

[Fix FOV]
; Fixes FOV issues.
; Can also add additional FOV (in degrees) during gameplay.
Enabled = true
AdditionalFOV = 0

;;;;;;;; Miscellaneous ;;;;;;;;;;

[Intro Skip]
; Set to true to skip opening logos.
Enabled = true

[Fix Analog Movement]
; Set to true to fix the 8-way analog movement.
Enabled = true

[Shadow Quality]
; Changes shadow resolution for the high quality shadow setting.
; Default high shadows = 2048.
; Set to 0 to disable.
Resolution = 0

[Disable Cutscene Letterboxing]
; Set to true to disable the stylised black bars during cutscenes.
Enabled = false